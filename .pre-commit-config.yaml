default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
        types: [python]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy .
        language: system
        require_serial: true
        pass_filenames: false

      - id: import-linter
        name: import-linter
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-tests
        name: architecture tests
        entry: .venv/bin/pytest tests/architecture
        language: system
        pass_filenames: false
        always_run: true

      - id: uv-audit
        name: uv-audit
        entry: uv audit --preview-features audit-command
        language: system
        pass_filenames: false
