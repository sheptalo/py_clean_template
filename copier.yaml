project_name:
    type: str
    help: What is your project name?

include_fastapi:
    type: bool
    help: Do you wanna include default FastAPI app?

include_dishka:
    type: bool
    help: Do you wanna include dishka?

auto_wire_use_cases:
    type: bool
    default: true
    when: "{{ include_dishka }}"
    help: Register use cases in DI automatically (scan application.use_cases)?

auto_wire_ports:
    type: bool
    default: true
    when: "{{ include_dishka }}"
    help: Register port implementations and their settings in DI automatically?

include_codegen:
    type: bool
    default: false
    help: Do you wanna generate the application layer (DTOs, ports, skeletons) from a YAML spec?

codegen_fastapi:
    type: bool
    default: "{{ include_codegen and include_fastapi and include_dishka }}"
    when: "{{ include_codegen and include_fastapi and include_dishka }}"
    help: Generate the FastAPI presentation layer from a YAML spec as well?

_tasks:
  - "uv sync"

_exclude:
  - "/README.md"
  - ".git"
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".DS_Store"
  - ".svn"
