project_name:
    type: str
    help: What is your project name?

include_fastapi:
    type: bool
    help: Do you wanna include default FastAPI app?

include_dishka:
    type: bool
    help: Do you wanna include dishka with auto-wiring?

_tasks:
  - "uv sync"

_exclude:
  - "README.md"
  - ".git"
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".DS_Store"
  - ".svn"
